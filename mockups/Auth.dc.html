<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Đăng nhập</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif}
:root{--background:#FAFAF6;--foreground:#1F2A22;--card:#FFFFFF;--muted:#F0F1E8;--muted-foreground:#55615A;--border:#DFE3D8;--input:#8A9486;--primary:#B82A17;--primary-foreground:#FFFFFF;--secondary:#E6F0E4;--secondary-foreground:#2F6B3F;--accent:#EEF1E6;--destructive:#B42318;--ring:#2F6B3F;--herb:#2F6B3F;--radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;height:44px;padding:0 18px;border-radius:var(--radius);font:500 14px/1 'Be Vietnam Pro',system-ui,sans-serif;border:1px solid transparent;box-sizing:border-box;cursor:pointer;text-decoration:none;transition:background-color .15s,color .15s,border-color .15s}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{background:#9A2212}
.btn-outline{background:var(--background);border-color:var(--input);color:var(--foreground)}
.btn-outline:hover{background:var(--accent)}
.au{width:100%;min-height:100vh;box-sizing:border-box;background:var(--background);color:var(--foreground);font-family:'Be Vietnam Pro',system-ui,sans-serif;container-type:inline-size}
.au a:focus-visible,.au button:focus-visible,.au input:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.au-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);min-height:100vh}
.au-art{position:relative;display:flex;flex-direction:column;justify-content:space-between;padding:40px;background:#E9D8B8;box-sizing:border-box}
.au-art-logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:24px;color:var(--foreground)}
.au-art-ph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted-foreground);font-size:14px}
.au-art-q{margin:0;font-family:'Fraunces',Georgia,serif;font-size:28px;line-height:1.25;font-weight:600;max-width:460px}
.au-art-by{margin:8px 0 0;font-size:14px;color:var(--muted-foreground)}
.au-main{display:flex;flex-direction:column;padding:24px 48px 48px;box-sizing:border-box}
.au-logo{display:none;align-items:center;gap:10px;align-self:flex-start;min-height:44px;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:24px;color:var(--foreground);text-decoration:none}
.au-logo svg{color:var(--primary)}
.au-art-logo svg{color:var(--primary)}
.au-top{display:flex;justify-content:flex-end;min-height:44px}
.au-top a{display:inline-flex;align-items:center;height:44px;padding:0 12px;border-radius:var(--radius);color:var(--foreground);font-size:14px;font-weight:500;text-decoration:none}
.au-top a:hover{background:var(--accent)}
.au-card{width:100%;max-width:400px;margin:auto;box-sizing:border-box}
.au-h1{margin:0 0 8px;font-family:'Fraunces',Georgia,serif;font-size:34px;line-height:1.15;font-weight:700;text-align:center}
.au-sub{margin:0 0 24px;font-size:14px;line-height:1.5;color:var(--muted-foreground);text-align:center}
.au-alert{display:flex;gap:10px;align-items:flex-start;margin:0 0 20px;padding:12px 14px;background:#FBE9E5;border:1px solid var(--destructive);border-radius:var(--radius);color:var(--destructive);font-size:14px;line-height:1.5}
.au-alert svg{flex:none;margin-top:2px}
.au-form{display:flex;flex-direction:column;gap:16px}
.au-field{display:flex;flex-direction:column;gap:8px;font-size:14px;font-weight:500}
.au-input{width:100%;height:44px;padding:0 12px;box-sizing:border-box;background:var(--background);border:1px solid var(--input);border-radius:var(--radius);color:var(--foreground);font:400 14px 'Be Vietnam Pro',system-ui,sans-serif}
.au-input::placeholder{color:var(--muted-foreground)}
.au-hint{font-size:13px;font-weight:400;color:var(--muted-foreground)}
.au-pw{position:relative}
.au-pw .au-input{padding-right:64px}
.au-eye{position:absolute;top:0;right:0;min-width:56px;height:44px;padding:0 12px;border:0;border-radius:var(--radius);background:transparent;color:var(--muted-foreground);font:500 14px 'Be Vietnam Pro',system-ui,sans-serif;cursor:pointer}
.au-eye:hover{color:var(--foreground)}
.au-rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px;margin:0;padding:0;list-style:none;font-size:13px;color:var(--muted-foreground)}
.au-rules li{display:flex;align-items:center;gap:8px}
.au-submit{width:100%}
.au-or{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--muted-foreground);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.au-or::before,.au-or::after{content:"";flex:1;height:1px;background:var(--border)}
.au-google{width:100%}
.au-terms{margin:0;font-size:13px;line-height:1.5;color:var(--muted-foreground);text-align:center}
.au-terms a,.au-switch a{color:var(--primary);font-weight:600;text-underline-offset:4px}
.au-switch{margin:20px 0 0;text-align:center;font-size:14px;color:var(--muted-foreground)}
@container (max-width: 999px) {
  .au-grid{grid-template-columns:minmax(0,1fr)}
  .au-art{display:none}
  .au-main{padding:20px 24px 40px}
  .au-logo{display:inline-flex}
  .au-top{display:none}
  .au-card{padding:32px;border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
}
@container (max-width: 767px) {
  .au-main{padding:8px 16px 32px}
  .au-card{padding:16px 0 0;border:0;border-radius:0;box-shadow:none}
  .au-h1{font-size:24px;text-align:left}
  .au-sub{text-align:left}
  .au-rules{grid-template-columns:minmax(0,1fr)}
}
</style>
</helmet>
<div class="au">
  <div class="au-grid">
    <aside class="au-art">
      <div class="au-art-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18a9 9 0 0 1-18 0z"></path><path d="M9 8c0-1.5 1-1.5 1-3"></path><path d="M14 8c0-1.5 1-1.5 1-3"></path></svg>
        Bếp Nhỏ
      </div>
      <div class="au-art-ph">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18a9 9 0 0 1-18 0z"></path><path d="M9 8c0-1.5 1-1.5 1-3"></path><path d="M14 8c0-1.5 1-1.5 1-3"></path></svg>
        <span>Ảnh minh họa</span>
      </div>
      <figure style="margin:0">
        <blockquote class="au-art-q" style="margin:0">Mỗi bữa cơm nhà bắt đầu từ một công thức tử tế.</blockquote>
        <figcaption class="au-art-by">Bếp Nhỏ</figcaption>
      </figure>
    </aside>
    <main class="au-main">
      <a class="au-logo" href="Main.dc.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18a9 9 0 0 1-18 0z"></path><path d="M9 8c0-1.5 1-1.5 1-3"></path><path d="M14 8c0-1.5 1-1.5 1-3"></path></svg>
        Bếp Nhỏ
      </a>
      <div class="au-top"><a href="{{switchHref}}">{{switchLink}}</a></div>
      <div class="au-card">
        <h1 class="au-h1">{{heading}}</h1>
        <p class="au-sub">{{sub}}</p>
        <sc-if value="{{showError}}" hint-placeholder-val="{{ false }}">
          <div class="au-alert" role="alert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>
            <span>{{errorText}}</span>
          </div>
        </sc-if>
        <form class="au-form" action="#">
          <sc-if value="{{isRegister}}" hint-placeholder-val="{{ false }}">
            <label class="au-field">Tên hiển thị
              <input class="au-input" type="text" name="display_name" autocomplete="name" minlength="2" maxlength="100" placeholder="Ví dụ: Minh Anh">
              <span class="au-hint">Từ 2 đến 100 ký tự.</span>
            </label>
          </sc-if>
          <label class="au-field">Email
            <input class="au-input" type="email" name="email" autocomplete="email" placeholder="ban@example.com">
          </label>
          <div class="au-field">
            <label for="au-pw">Mật khẩu</label>
            <div class="au-pw">
              <input class="au-input" id="au-pw" type="{{pwType}}" name="password" autocomplete="{{pwAuto}}" placeholder="Nhập mật khẩu">
              <button class="au-eye" type="button" onClick="{{toggle}}" aria-pressed="{{show}}" aria-label="Hiện mật khẩu">{{eyeText}}</button>
            </div>
          </div>
          <sc-if value="{{isRegister}}" hint-placeholder-val="{{ false }}">
            <ul class="au-rules" aria-label="Yêu cầu mật khẩu">
              <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg>Tối thiểu 8 ký tự</li>
              <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg>1 chữ hoa</li>
              <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg>1 chữ số</li>
              <li><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle></svg>1 ký tự đặc biệt</li>
            </ul>
          </sc-if>
          <button class="btn btn-primary au-submit" type="submit">{{submit}}</button>
        </form>
        <div class="au-or">Hoặc</div>
        <button class="btn btn-outline au-google" type="button">Tiếp tục với Google</button>
        <sc-if value="{{isRegister}}" hint-placeholder-val="{{ false }}">
          <p class="au-terms" style="margin-top:20px">Bằng việc tạo tài khoản, bạn đồng ý với <a href="#">Điều khoản sử dụng</a>.</p>
        </sc-if>
        <p class="au-switch">{{switchText}} <a href="{{switchHref}}">{{switchLink}}</a></p>
      </div>
    </main>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","default":"login","options":["login","register"]},"size":{"editor":"enum","default":"desktop","options":["desktop","tablet","mobile"]},"showError":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":820}}'>
class Component extends DCLogic {
  state = { show: false };
  renderVals() {
    const isRegister = this.props.mode === 'register';
    const size = ['tablet', 'mobile'].includes(this.props.size) ? this.props.size : 'desktop';
    const cap = size.charAt(0).toUpperCase() + size.slice(1);
    const loginHref = size === 'desktop' ? 'Auth.dc.html' : 'Login' + cap + '.dc.html';
    const registerHref = 'Register' + cap + '.dc.html';
    const show = !!this.state.show;
    return {
      isRegister,
      heading: isRegister ? 'Tạo tài khoản' : 'Chào mừng trở lại',
      sub: isRegister ? 'Lưu công thức yêu thích và chia sẻ món ngon của bạn.' : 'Đăng nhập để lưu và đăng công thức của bạn.',
      submit: isRegister ? 'Tạo tài khoản' : 'Đăng nhập',
      switchText: isRegister ? 'Đã có tài khoản?' : 'Chưa có tài khoản?',
      switchLink: isRegister ? 'Đăng nhập' : 'Đăng ký',
      switchHref: isRegister ? loginHref : registerHref,
      showError: this.props.showError === true || this.props.showError === 'true',
      errorText: isRegister ? 'Email này đã được đăng ký. Hãy đăng nhập hoặc dùng email khác.' : 'Email hoặc mật khẩu không đúng.',
      pwType: show ? 'text' : 'password',
      pwAuto: isRegister ? 'new-password' : 'current-password',
      show,
      eyeText: show ? 'Ẩn' : 'Hiện',
      toggle: () => this.setState({ show: !this.state.show })
    };
  }
}
</script>
</body>
</html>
