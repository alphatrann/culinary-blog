<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thẻ công thức</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif}
:root{--background:#FAFAF6;--foreground:#1F2A22;--card:#FFFFFF;--muted:#F0F1E8;--muted-foreground:#55615A;--border:#DFE3D8;--input:#8A9486;--primary:#B82A17;--primary-foreground:#FFFFFF;--secondary:#E6F0E4;--secondary-foreground:#2F6B3F;--accent:#EEF1E6;--destructive:#B42318;--ring:#2F6B3F;--herb:#2F6B3F;--radius:8px}
.rcd{display:block;height:100%;box-sizing:border-box;overflow:hidden;background:var(--card);color:var(--foreground);text-decoration:none;font-family:'Be Vietnam Pro',system-ui,sans-serif;border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.05);transition:box-shadow .15s}
.rcd:hover{box-shadow:0 4px 12px rgba(0,0,0,.08)}
.rcd:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.rcd-img{position:relative;aspect-ratio:4 / 3;background:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted-foreground);font-size:13px;border-bottom:1px solid var(--border)}
.rcd-photo{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.rcd-badge{z-index:1;position:absolute;top:12px;left:12px;display:inline-flex;align-items:center;height:24px;padding:0 10px;background:var(--background);border:1px solid var(--border);border-radius:999px;color:var(--foreground);font-size:12px;font-weight:600}
.rcd-body{padding:16px}
.rcd-title{margin:0 0 8px;font-family:'Fraunces',Georgia,serif;font-size:20px;line-height:1.25;font-weight:600}
.rcd:hover .rcd-title{color:var(--primary)}
.rcd-meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted-foreground)}
.rcd-meta span{display:inline-flex;align-items:center;gap:6px}
.rcd-author{display:block;margin-top:8px;font-size:14px;color:var(--muted-foreground)}
</style>
</helmet>
<a class="rcd" href="{{item.href}}">
  <div class="rcd-img" style="background: {{item.tint}}">
    <span class="rcd-badge">{{item.category}}</span>
    <sc-if value="{{noImg}}" hint-placeholder-val="{{ true }}">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18a9 9 0 0 1-18 0z"></path><path d="M9 8c0-1.5 1-1.5 1-3"></path><path d="M14 8c0-1.5 1-1.5 1-3"></path></svg>
      <span>Ảnh món ăn</span>
    </sc-if>
    <sc-if value="{{hasImg}}" hint-placeholder-val="{{ false }}">
      <img class="rcd-photo" src="{{item.img}}" alt="{{item.title}}">
    </sc-if>
  </div>
  <div class="rcd-body">
    <h3 class="rcd-title">{{item.title}}</h3>
    <div class="rcd-meta">
      <span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        {{item.time}}
      </span>
      <span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 20v-5"></path><path d="M12 20V9"></path><path d="M18 20V4"></path></svg>
        {{item.difficulty}}
      </span>
    </div>
    <span class="rcd-author">Bởi {{item.author}}</span>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"$preview":{"width":300,"height":400}}'>
class Component extends DCLogic {
  renderVals() {
    const fallback = {
      title: 'Phở bò Hà Nội',
      category: 'Món nước',
      time: '3 giờ',
      difficulty: 'Trung bình',
      author: 'Minh Anh',
      tint: '#E9D8B8',
      href: 'Recipe.dc.html'
    };
    const item = this.props.item ?? fallback;
    return { item, hasImg: !!item.img, noImg: !item.img };
  }
}
</script>
</body>
</html>
