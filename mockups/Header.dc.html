<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thanh điều hướng</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif}
:root{--background:#FAFAF6;--foreground:#1F2A22;--card:#FFFFFF;--muted:#F0F1E8;--muted-foreground:#55615A;--border:#DFE3D8;--input:#8A9486;--primary:#B82A17;--primary-foreground:#FFFFFF;--secondary:#E6F0E4;--secondary-foreground:#2F6B3F;--accent:#EEF1E6;--destructive:#B42318;--ring:#2F6B3F;--herb:#2F6B3F;--radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;height:44px;padding:0 18px;border-radius:var(--radius);font:500 14px/1 'Be Vietnam Pro',system-ui,sans-serif;border:1px solid transparent;box-sizing:border-box;cursor:pointer;text-decoration:none;transition:background-color .15s,color .15s,border-color .15s}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{background:#9A2212}
.btn-outline{background:var(--background);border-color:var(--input);color:var(--foreground)}
.btn-outline:hover{background:var(--accent)}
.btn-ghost{background:transparent;color:var(--foreground)}
.btn-ghost:hover{background:var(--accent)}
.btn:focus-visible,.hd a:focus-visible,.hd button:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.hd{background:var(--background);border-bottom:1px solid var(--border);color:var(--foreground);font-family:'Be Vietnam Pro',system-ui,sans-serif}
.hd-in{max-width:1200px;margin:0 auto;padding:0 32px;height:64px;display:flex;align-items:center;gap:16px;box-sizing:border-box}
.hd-logo{display:flex;align-items:center;gap:10px;min-height:44px;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:24px;color:var(--foreground);text-decoration:none}
.hd-logo svg{color:var(--primary)}
.hd-nav{display:flex;gap:4px;margin-left:16px}
.hd-nav a{display:flex;align-items:center;height:44px;padding:0 12px;border-radius:var(--radius);color:var(--muted-foreground);font-size:14px;font-weight:500;text-decoration:none}
.hd-nav a:hover{background:var(--accent);color:var(--foreground)}
.hd-spacer{flex:1}
.hd-search{position:relative;width:260px;color:var(--muted-foreground)}
.hd-search svg{position:absolute;left:12px;top:14px;pointer-events:none}
.hd-search input{width:100%;height:44px;padding:0 12px 0 38px;box-sizing:border-box;background:var(--background);border:1px solid var(--input);border-radius:var(--radius);color:var(--foreground);font:400 14px 'Be Vietnam Pro',system-ui,sans-serif}
.hd-search input::placeholder{color:var(--muted-foreground)}
.hd-search input:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.hd-actions{display:flex;gap:8px;align-items:center}
.hd-iconbtn{width:44px;height:44px;border:0;background:transparent;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;color:var(--foreground);cursor:pointer}
.hd-iconbtn:hover{background:var(--accent)}
.hd-menu,.hd-searchbtn{display:none}
.hd-avatar{display:flex;align-items:center;justify-content:center;flex:none;width:44px;height:44px;border-radius:999px;background:var(--herb);color:#fff;font-size:14px;font-weight:600;text-decoration:none}
.hd-avatar:hover{background:#255735}
@container (max-width: 1099px) {
  .hd-nav{display:none}
  .hd-menu{display:flex}
  .hd-search{width:200px}
}
@container (max-width: 767px) {
  .hd-in{padding:0 12px 0 16px;gap:4px}
  .hd-search,.hd-actions,.hd-write{display:none}
  .hd-searchbtn{display:flex}
}
</style>
</helmet>
<header class="hd">
  <div class="hd-in">
    <a class="hd-logo" href="Main.dc.html">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h18a9 9 0 0 1-18 0z"></path><path d="M9 8c0-1.5 1-1.5 1-3"></path><path d="M14 8c0-1.5 1-1.5 1-3"></path></svg>
      Bếp Nhỏ
    </a>
    <nav class="hd-nav" aria-label="Điều hướng chính">
      <a href="Main.dc.html">Công thức</a>
      <a href="#">Danh mục</a>
      <a href="#">Viết công thức</a>
    </nav>
    <div class="hd-spacer"></div>
    <form class="hd-search" role="search" action="#">
      <label class="sr" for="hd-q">Tìm công thức</label>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      <input id="hd-q" type="search" placeholder="Tìm công thức">
    </form>
    <sc-if value="{{isGuest}}" hint-placeholder-val="{{ true }}">
      <div class="hd-actions">
        <a class="btn btn-outline" href="Auth.dc.html">Đăng nhập</a>
        <a class="btn btn-primary" href="RegisterDesktop.dc.html">Đăng ký</a>
      </div>
    </sc-if>
    <sc-if value="{{isUser}}" hint-placeholder-val="{{ false }}">
      <a class="btn btn-primary hd-write" href="Editor.dc.html">Viết công thức</a>
      <a class="hd-avatar" href="Profile.dc.html" aria-label="Hồ sơ của bạn">MA</a>
    </sc-if>
    <button class="hd-iconbtn hd-searchbtn" type="button" aria-label="Tìm kiếm">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
    </button>
    <button class="hd-iconbtn hd-menu" type="button" aria-label="Mở menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 12h16"></path><path d="M4 18h16"></path></svg>
    </button>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"user":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":65}}'>
class Component extends DCLogic {
  renderVals() {
    const isUser = this.props.user === true || this.props.user === 'true';
    return { isUser, isGuest: !isUser };
  }
}
</script>
</body>
</html>
