<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'Be Vietnam Pro',system-ui,sans-serif}
:root{--background:#FAFAF6;--foreground:#1F2A22;--card:#FFFFFF;--muted:#F0F1E8;--muted-foreground:#55615A;--border:#DFE3D8;--input:#8A9486;--primary:#B82A17;--primary-foreground:#FFFFFF;--secondary:#E6F0E4;--secondary-foreground:#2F6B3F;--accent:#EEF1E6;--destructive:#B42318;--ring:#2F6B3F;--herb:#2F6B3F;--radius:8px}
.ft{background:var(--background);border-top:1px solid var(--border);color:var(--muted-foreground);font-family:'Be Vietnam Pro',system-ui,sans-serif}
.ft-in{max-width:1200px;margin:0 auto;padding:48px 32px 32px;box-sizing:border-box;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px}
.ft-logo{display:flex;align-items:center;gap:10px;font-family:'Fraunces',Georgia,serif;font-weight:700;font-size:24px;color:var(--foreground)}
.ft-logo svg{color:var(--primary)}
.ft-brand p{margin:12px 0 0;font-size:14px;line-height:1.6;max-width:320px}
.ft-h{margin:0 0 8px;font-size:14px;font-weight:600;color:var(--foreground)}
.ft ul{list-style:none;margin:0;padding:0}
.ft li a{display:flex;align-items:center;min-height:44px;color:var(--muted-foreground);text-decoration:none;font-size:14px}
.ft li a:hover{color:var(--foreground);text-decoration:underline}
.ft a:focus-visible{outline:2px solid var(--ring);outline-offset:2px;border-radius:4px}
.ft-bottom{max-width:1200px;margin:0 auto;padding:20px 32px 28px;box-sizing:border-box;border-top:1px solid var(--border);font-size:14px}
@container (max-width: 999px) {
  .ft-in{grid-template-columns:repeat(3,minmax(0,1fr))}
  .ft-brand{grid-column:1 / -1}
}
@container (max-width: 767px) {
  .ft-in{grid-template-columns:repeat(2,minmax(0,1fr));padding:32px 16px 16px;gap:16px 24px}
  .ft-bottom{padding:20px 16px 28px}
}
</style>
</helmet>

        Bếp Nhỏ

      <p>Công thức nấu ăn Việt, từng bước rõ ràng cho bữa cơm gia đình.</p>
    </div>
    <nav aria-label="Khám phá">

    <nav aria-label="Thông tin">

        <li><a href="#">Điều khoản sử dụng</a></li>
      </ul>
    </nav>
  </div>
  <div class="ft-bottom">© 2026 Bếp Nhỏ. Mọi quyền được bảo lưu.</div>
</footer>
