name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run lint-imports

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      # Real Redis for the cache concurrency tests (tests/cache/test_redis_cache_integration.py).
      - name: Start test Redis
        run: |
          url=$(PORT=6379 scripts/test-redis.sh start)
          echo "TEST_REDIS_URL=$url" >> "$GITHUB_ENV"
      - run: uv run pytest

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv sync --locked
      - run: npm ci
        working-directory: web
      - name: API types are up to date
        working-directory: web
        run: |
          npm run api:sync
          git diff --exit-code -- openapi.json src/lib/api/schema.d.ts
      - run: npm run lint
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run build
        working-directory: web

  # The full stack in production shape (compose.e2e.yml), shared by the e2e and Lighthouse jobs.
  web-e2e:
    name: Web e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose -f compose.e2e.yml up -d --build --wait
      - name: Seed categories
        run: docker compose -f compose.e2e.yml exec -T postgres psql -U culinary -d culinary_blog -v ON_ERROR_STOP=1 < web/e2e/seed.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Run e2e
        working-directory: web
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_API_URL: http://localhost:8080
        run: npm run e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - name: Dump stack logs
        if: failure()
        run: docker compose -f compose.e2e.yml logs --no-color > e2e-stack.log
      - name: Upload stack logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-stack-logs
          path: e2e-stack.log
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose -f compose.e2e.yml down -v

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: [web]
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose -f compose.e2e.yml up -d --build --wait
      - name: Seed categories
        run: docker compose -f compose.e2e.yml exec -T postgres psql -U culinary -d culinary_blog -v ON_ERROR_STOP=1 < web/e2e/seed.sql
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i -g @lhci/cli@0.15.1
      - name: Lighthouse budgets
        working-directory: web
        run: lhci autorun
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: web/lhci-reports
          retention-days: 7
      - name: Stop the stack
        if: always()
        run: docker compose -f compose.e2e.yml down -v
