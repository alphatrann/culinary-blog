name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run lint-imports

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      # Real Redis for the cache concurrency tests (tests/cache/test_redis_cache_integration.py).
      - name: Start test Redis
        run: |
          url=$(PORT=6379 scripts/test-redis.sh start)
          echo "TEST_REDIS_URL=$url" >> "$GITHUB_ENV"
      - run: uv run pytest
