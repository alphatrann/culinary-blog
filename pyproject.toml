[project]
name = "culinary-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alphatrann", email = "alphatran.forwork@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.0",
    "pydantic-settings>=2.6.0",
    "redis>=8.1.0",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
culinary-blog = "culinary_blog:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
