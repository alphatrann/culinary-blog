[project]
name = "culinary-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "alphatrann", email = "alphatran.forwork@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "email-validator>=2.2",
    "fastapi>=0.141.1",
    "httpx>=0.28.0",
    "minio>=7.2.20",
    "passlib[argon2]>=1.7.4",
    "pillow>=12.3.0",
    "pydantic-settings>=2.6.0",
    "pyjwt>=2.9",
    "python-multipart>=0.0.32",
    "redis>=8.1.0",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
culinary-blog = "culinary_blog:main"
culinary-blog-image-worker = "culinary_blog.workers.image:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.importlinter]
root_package = "culinary_blog"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "CQRS layering (CONS-001)"
type = "layers"
layers = [
    "router",
    "(commands) | (queries)",
    "(repository)",
    "(models) | (schemas)",
]
containers = ["culinary_blog.health", "culinary_blog.auth", "culinary_blog.categories", "culinary_blog.recipes"]

[[tool.importlinter.contracts]]
name = "Handlers and repositories are HTTP-free (NFR-MAINT-004)"
type = "forbidden"
source_modules = [
    "culinary_blog.*.commands",
    "culinary_blog.*.queries",
    "culinary_blog.*.repository",
    "culinary_blog.*.models",
]
forbidden_modules = ["fastapi", "starlette"]
