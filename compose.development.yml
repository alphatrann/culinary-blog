name: culinary-blog-dev

# Infra dependencies only — the API runs natively via `uv run` for real hot reload
# (no bind-mount / rebuild step). Nginx and the containerized API image are
# production-only. See ADR-0009.

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .env.development
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-culinary}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache-redis:
    build:
      context: .
      dockerfile: docker/redis-cache.Dockerfile
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  queue-redis:
    build:
      context: .
      dockerfile: docker/redis-job-queue.Dockerfile
    volumes:
      - queuedata:/data
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ratelimit-redis:
    build:
      context: .
      dockerfile: docker/redis-rate-limit.Dockerfile
    volumes:
      - ratelimitdata:/data
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    command: server /data --console-address ":9001"
    env_file:
      - .env.development
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1  # dev SMTP sink: SMTP on 1025, web UI on 8025
    ports:
      - "1025:1025"
      - "8025:8025"

  # Workers run from the api image. Inside the network they reach the infra by service name, not localhost.
  image-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["culinary-blog-image-worker"]
    env_file:
      - .env.development
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-culinary}:${POSTGRES_PASSWORD:-culinary}@postgres:5432/${POSTGRES_DB:-culinary_blog}
      CACHE_REDIS_URL: redis://cache-redis:6379/0
      QUEUE_REDIS_URL: redis://queue-redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      cache-redis:
        condition: service_healthy
      queue-redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  email-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["culinary-blog-email-worker"]
    env_file:
      - .env.development
    environment:
      QUEUE_REDIS_URL: redis://queue-redis:6379/0
      SMTP_HOST: mailhog
    depends_on:
      queue-redis:
        condition: service_healthy
      mailhog:
        condition: service_started

  sitemap-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["culinary-blog-sitemap-worker"]
    env_file:
      - .env.development
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-culinary}:${POSTGRES_PASSWORD:-culinary}@postgres:5432/${POSTGRES_DB:-culinary_blog}
      QUEUE_REDIS_URL: redis://queue-redis:6379/0
      MINIO_ENDPOINT: minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      queue-redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # Keep this single-replica: every running copy enqueues its own daily sitemap job.
  cronjobs:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["culinary-blog-cron"]
    env_file:
      - .env.development
    environment:
      QUEUE_REDIS_URL: redis://queue-redis:6379/0
    depends_on:
      queue-redis:
        condition: service_healthy

volumes:
  pgdata:
  queuedata:
  ratelimitdata:
  miniodata:
