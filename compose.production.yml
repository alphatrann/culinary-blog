name: culinary-blog-prod

services:
  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api
      - web

  web:
    build:
      context: web
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_BASE_URL: http://api:8000

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    cpus: 2.0
    mem_limit: 4g
    command: ["uvicorn", "culinary_blog.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    env_file:
      - .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
      cache-redis:
        condition: service_healthy
      queue-redis:
        condition: service_healthy
      ratelimit-redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    env_file:
      - .env.production
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "log_min_duration_statement=100"]
    env_file:
      - .env.production
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-culinary}"]
      interval: 5s
      timeout: 5s
      retries: 10

  cache-redis:
    build:
      context: .
      dockerfile: docker/redis-cache.Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  queue-redis:
    build:
      context: .
      dockerfile: docker/redis-job-queue.Dockerfile
    restart: unless-stopped
    volumes:
      - queuedata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ratelimit-redis:
    build:
      context: .
      dockerfile: docker/redis-rate-limit.Dockerfile
    restart: unless-stopped
    volumes:
      - ratelimitdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - .env.production
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  otel-collector:
    build:
      context: .
      dockerfile: docker/otel-collector.Dockerfile
    restart: unless-stopped
    depends_on:
      - tempo
      - loki
      - prometheus

  tempo:
    build:
      context: .
      dockerfile: docker/tempo.Dockerfile
    restart: unless-stopped
    mem_limit: 512m
    environment:
      GOMEMLIMIT: 400MiB  # make the Go GC back off before the cgroup OOM-killer fires
    volumes:
      - tempodata:/var/tempo

  loki:
    build:
      context: .
      dockerfile: docker/loki.Dockerfile
    restart: unless-stopped
    volumes:
      - lokidata:/loki

  prometheus:
    build:
      context: .
      dockerfile: docker/prometheus.Dockerfile
    restart: unless-stopped
    volumes:
      - prometheusdata:/prometheus

  grafana:
    build:
      context: .
      dockerfile: docker/grafana.Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      - grafanadata:/var/lib/grafana
    depends_on:
      - tempo
      - loki
      - prometheus

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    restart: unless-stopped
    env_file:
      - .env.production
    # The exporter reads DATA_SOURCE_*, which .env.production doesn't define; derive them from POSTGRES_*.
    entrypoint:
      - /bin/sh
      - -c
      - >-
        export DATA_SOURCE_USER="$$POSTGRES_USER" DATA_SOURCE_PASS="$$POSTGRES_PASSWORD"
        DATA_SOURCE_URI="postgres:5432/$$POSTGRES_DB?sslmode=disable";
        exec /bin/postgres_exporter
    depends_on:
      postgres:
        condition: service_healthy

  cache-redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    command: ["--redis.addr=redis://cache-redis:6379"]
    depends_on:
      cache-redis:
        condition: service_healthy

  queue-redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    command: ["--redis.addr=redis://queue-redis:6379"]
    depends_on:
      queue-redis:
        condition: service_healthy

  ratelimit-redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    restart: unless-stopped
    command: ["--redis.addr=redis://ratelimit-redis:6379"]
    depends_on:
      ratelimit-redis:
        condition: service_healthy

volumes:
  pgdata:
  queuedata:
  ratelimitdata:
  miniodata:
  tempodata:
  lokidata:
  prometheusdata:
  grafanadata:
