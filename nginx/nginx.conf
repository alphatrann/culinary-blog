worker_processes auto;

events {
    # each proxied request holds two connections (client + upstream)
    worker_connections 4096;
}

http {
    # Docker's embedded DNS, re-resolved every 5s: a plain `upstream { server api:8000; }` resolves once at
    # startup, so an API container restart (new IP) left nginx returning 502 until reload.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # Frontend on http://localhost, backend on http://api.localhost (separate hosts, so the API's HttpOnly
    # cookies are host-scoped to api.localhost and the browser calls it cross-origin with credentials).
    server {
        listen 80;
        server_name localhost;

        set $api_upstream api:8000;
        set $web_upstream web:3000;

        # Browser API calls stay same-origin, so the HttpOnly cookies are first-party (SameSite=Lax would drop
        # them on a cross-host call such as localhost -> api.localhost). api.localhost remains for direct access.
        location /api/ {
            client_max_body_size 6m;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # robots.txt points crawlers at /sitemap.xml on the web origin, so it is served by the API here.
        location = /sitemap.xml {
            proxy_pass http://$api_upstream;
            proxy_set_header Host api.localhost;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # NFR-SEC-004 (XSS): the HTML pages get a CSP. Next.js hydration needs inline scripts/styles, so
        # 'unsafe-inline' stays until pages move to per-request nonces (ADR-0015).
        location / {
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
            proxy_pass http://$web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # Grafana dashboards (Tempo/Loki/Prometheus), proxied through nginx instead of a published host port.
    server {
        listen 80;
        server_name grafana.localhost;

        set $grafana_upstream grafana:3000;

        location / {
            proxy_pass http://$grafana_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Grafana Live streams over websockets.
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    server {
        listen 80;
        server_name api.localhost;

        set $api_upstream api:8000;

        location / {
            # 5 MB image plus multipart overhead; nginx's 1 MB default would reject valid uploads with 413.
            client_max_body_size 6m;
            # No CSP here: /docs (Swagger UI) loads its scripts from a CDN. The API returns JSON, not HTML.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header X-Frame-Options "DENY" always;
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
