worker_processes auto;

events {
    # each proxied request holds two connections (client + upstream)
    worker_connections 4096;
}

http {
    server {
        listen 80;
        server_name _;

        # Docker's embedded DNS, re-resolved every 5s: a plain `upstream { server api:8000; }` resolves once at
        # startup, so an API container restart (new IP) left nginx returning 502 until reload.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api_upstream api:8000;

        location / {
            proxy_pass http://$api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
