global:
  scrape_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: redis-cache
    static_configs:
      - targets: ["cache-redis-exporter:9121"]
  - job_name: redis-queue
    static_configs:
      - targets: ["queue-redis-exporter:9121"]
  - job_name: redis-ratelimit
    static_configs:
      - targets: ["ratelimit-redis-exporter:9121"]
